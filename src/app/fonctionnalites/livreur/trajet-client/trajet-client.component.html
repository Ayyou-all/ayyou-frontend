<div class="relative w-full min-h-screen bg-[#fcf8f2] flex flex-col justify-between overflow-hidden select-none font-['Plus_Jakarta_Sans',sans-serif]">

  <!-- ========================================================================= -->
  <!-- 1. CONTRÔLES SUPÉRIEURS FLOTTANTS (CONFORME À L'IMAGE 2)                  -->
  <!-- ========================================================================= -->
  <div class="absolute top-0 left-0 right-0 z-30 pt-6 px-4 sm:px-6">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-3">
      
      <!-- Bouton Retour blanc -->
      <button
        type="button"
        (click)="retourner()"
        class="w-12 h-12 rounded-2xl bg-white hover:bg-slate-50 text-slate-800 flex items-center justify-center shadow-lg transition-transform active:scale-95 cursor-pointer shrink-0"
        aria-label="Retour"
      >
        <i class="fa-solid fa-chevron-left text-base font-bold"></i>
      </button>

      <!-- Badge central flottant : ESTIMATION + 8 min • 2.4 km -->
      <div class="px-4 py-2.5 rounded-2xl bg-white/95 backdrop-blur-md shadow-lg border border-orange-100 flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl bg-rose-50 text-[#E51824] flex items-center justify-center shrink-0">
          <i class="fa-solid fa-location-arrow text-xs"></i>
        </div>
        <div>
          <span class="block text-[9px] font-black text-slate-400 tracking-wider uppercase">
            ESTIMATION
          </span>
          <span class="text-sm sm:text-base font-black text-slate-900 font-['Outfit']">
            8 min • 2.4 km
          </span>
        </div>
      </div>

      <!-- Bouton Calques de carte (à droite) -->
      <button
        type="button"
        (click)="basculerStyleCarte()"
        class="w-12 h-12 rounded-2xl bg-white hover:bg-slate-50 text-slate-800 flex items-center justify-center shadow-lg transition-transform active:scale-95 cursor-pointer shrink-0"
        aria-label="Basculer le style de carte"
        title="Basculer style clair / sombre"
      >
        <i class="fa-solid fa-layer-group text-sm"></i>
      </button>

    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- 2. CARTE GPS RÉELLE DE DAKAR : TRAJET CORNICHE OUEST / VDN VERS ALMADIES  -->
  <!-- ========================================================================= -->
  <div class="absolute inset-0 z-10 w-full h-full overflow-hidden">
    
    <!-- Conteneur Leaflet réel de Dakar -->
    <div id="carte-trajet-client" class="w-full h-full z-0"></div>

    <!-- BOUTON FLOTTANT RECENTRER GPS (CÔTÉ DROIT) -->
    <div class="absolute right-4 top-[56%] z-30">
      <button
        type="button"
        (click)="recentrerPosition()"
        class="w-12 h-12 rounded-2xl bg-white hover:bg-slate-50 text-[#E51824] shadow-xl flex items-center justify-center transition-transform active:scale-90 cursor-pointer"
        aria-label="Recentrer ma position"
        title="Recentrer sur le livreur Moussa"
      >
        <i class="fa-solid fa-crosshairs text-lg"></i>
      </button>
    </div>

  </div>

  <!-- ========================================================================= -->
  <!-- 3. CARTE INFÉRIEURE : CLIENT + ADRESSE + BOUTON ARRIVÉ CHEZ LE CLIENT     -->
  <!-- Conforme au bas de l'Image 2                                              -->
  <!-- ========================================================================= -->
  <div class="relative z-30 w-full max-w-xl mx-auto p-4 pb-6 sm:pb-8">
    <div class="bg-white rounded-[36px] p-5 sm:p-6 shadow-2xl border border-orange-100/60 space-y-4">
      
      <!-- Fiche Client + Photo avec point vert + Bouton téléphone -->
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3.5 min-w-0 flex-1">
          <!-- Avatar client avec pastille verte -->
          <div class="relative w-14 h-14 rounded-2xl overflow-hidden bg-slate-100 border border-slate-200 shrink-0">
            <img
              src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150"
              alt="Client"
              class="w-full h-full object-cover"
            />
            <span class="absolute bottom-1 right-1 w-3.5 h-3.5 rounded-full bg-[#22c55e] border-2 border-white"></span>
          </div>

          <!-- Nom et adresse -->
          <div class="min-w-0 flex-1">
            <h3 class="text-xl sm:text-2xl font-black text-slate-900 truncate font-['Outfit']">
              {{ serviceLivreur.courseEnCours()?.clientNom || 'Moussa Diop' }}
            </h3>
            <div class="flex items-center gap-1.5 text-xs sm:text-sm text-slate-500 font-medium truncate mt-0.5">
              <i class="fa-solid fa-location-dot text-[#E51824] text-xs"></i>
              <span class="truncate">{{ serviceLivreur.courseEnCours()?.clientAdresse || 'Almadies, Villa 45' }}</span>
            </div>
          </div>
        </div>

        <!-- Bouton d'appel sombre -->
        <a
          [href]="'tel:' + (serviceLivreur.courseEnCours()?.clientTelephone || '+221778214490')"
          class="w-13 h-13 rounded-2xl bg-[#1e293b] hover:bg-slate-900 text-white flex items-center justify-center shadow-md transition-transform active:scale-95 shrink-0"
          title="Appeler le client"
        >
          <i class="fa-solid fa-phone text-base"></i>
        </a>
      </div>

      <!-- Encart Consignes de livraison (Sonner à l'entrée...) -->
      <div class="bg-[#f8fafc] rounded-2xl p-3.5 border border-slate-100 flex items-start gap-2.5">
        <i class="fa-solid fa-circle-info text-[#E51824] text-sm mt-0.5 shrink-0"></i>
        <p class="text-xs sm:text-sm text-slate-600 font-medium leading-relaxed">
          {{ serviceLivreur.courseEnCours()?.clientInstructions || 'Sonner à l\'entrée, 2ème étage à droite.' }}
        </p>
      </div>

      <!-- GROS BOUTON ROUGE : ARRIVÉ CHEZ LE CLIENT -->
      <button
        type="button"
        (click)="arriverChezClient()"
        class="w-full py-4 px-6 rounded-2xl bg-[#E51824] hover:bg-red-700 active:scale-[0.99] text-white font-black text-base flex items-center justify-center gap-2.5 shadow-xl shadow-red-500/25 transition-all cursor-pointer"
      >
        <span>Arrivé chez le client</span>
        <i class="fa-solid fa-circle-check text-base"></i>
      </button>

    </div>
  </div>

</div>
